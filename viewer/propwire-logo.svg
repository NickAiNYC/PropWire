<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ICON: Abstracted Wire Signal / Boundary Rails -->
  <!-- Top Rail -->
  <rect x="30" y="42" width="70" height="3" fill="#111110" rx="1.5"/>
  <!-- Bottom Rail -->
  <rect x="30" y="75" width="70" height="3" fill="#111110" rx="1.5"/>
  <!-- Edge Node (Data Point) -->
  <circle cx="65" cy="58.5" r="5" fill="#15803d"/>

  <!-- TYPOGRAPHY: Refined Tracking & Hierarchy -->
  <!-- "PROP" in clean, medium-weight neo-grotesque -->
  <text x="130" y="66" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500" letter-spacing="2.5" fill="#111110">PROP</text>
  
  <!-- Subtle Emerald Dot -->
  <text x="232" y="66" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500" fill="#15803d">·</text>
  
  <!-- "WIRE" in precise monospace (evokes terminal/data feed) -->
  <text x="258" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="600" letter-spacing="1" fill="#111110">WIRE</text>
</svg>
